<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>chatAI</title>
<style>
  body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 0 16px; }
  #log { border: 1px solid #ccc; border-radius: 6px; padding: 10px; height: 400px; overflow-y: auto; }
  #log p { margin: 4px 0; white-space: pre-wrap; }
  .user { color: #06c; }
  .ai { color: #090; }
  form { display: flex; gap: 8px; margin-top: 10px; }
  input[type=text] { flex: 1; padding: 8px; }
  button { padding: 8px 14px; }
  details { margin-top: 10px; }
  .param-row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  .param-row label { width: 160px; }
  .param-row output { width: 40px; text-align: right; }
</style>
</head>
<body>
<h1>chatAI</h1>
<p><a href="/train">学習操作パネルへ</a></p>
<div id="log"></div>
<form id="chat-form">
  <input type="text" id="message" autocomplete="off" placeholder="メッセージを入力">
  <button type="submit">送信</button>
  <button type="button" id="reset">会話リセット</button>
</form>

<details>
  <summary>生成パラメータ調整</summary>
  <div class="param-row">
    <label for="p-temperature">temperature</label>
    <input type="range" id="p-temperature" min="0.1" max="2.0" step="0.1" value="0.8"
      oninput="document.getElementById('o-temperature').textContent = this.value">
    <output id="o-temperature">0.8</output>
  </div>
  <div class="param-row">
    <label for="p-top_k">top_k</label>
    <input type="range" id="p-top_k" min="1" max="100" step="1" value="20"
      oninput="document.getElementById('o-top_k').textContent = this.value">
    <output id="o-top_k">20</output>
  </div>
  <div class="param-row">
    <label for="p-top_p">top_p</label>
    <input type="range" id="p-top_p" min="0.1" max="1.0" step="0.05" value="0.9"
      oninput="document.getElementById('o-top_p').textContent = this.value">
    <output id="o-top_p">0.9</output>
  </div>
  <div class="param-row">
    <label for="p-repetition_penalty">repetition_penalty</label>
    <input type="range" id="p-repetition_penalty" min="1.0" max="2.0" step="0.05" value="1.3"
      oninput="document.getElementById('o-repetition_penalty').textContent = this.value">
    <output id="o-repetition_penalty">1.3</output>
  </div>
</details>

<script>
const log = document.getElementById("log");
const form = document.getElementById("chat-form");
const input = document.getElementById("message");

function append(role, text) {
  const p = document.createElement("p");
  p.className = role;
  p.textContent = (role === "user" ? "User: " : "AI: ") + text;
  log.appendChild(p);
  log.scrollTop = log.scrollHeight;
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const message = input.value.trim();
  if (!message) return;
  append("user", message);
  input.value = "";

  const res = await fetch("/api/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      message,
      temperature: parseFloat(document.getElementById("p-temperature").value),
      top_k: parseInt(document.getElementById("p-top_k").value, 10),
      top_p: parseFloat(document.getElementById("p-top_p").value),
      repetition_penalty: parseFloat(document.getElementById("p-repetition_penalty").value),
    }),
  });
  const data = await res.json();
  append("ai", data.error ? "[エラー] " + data.error : data.reply);
});

document.getElementById("reset").addEventListener("click", async () => {
  await fetch("/api/chat/reset", { method: "POST" });
  log.innerHTML = "";
});
</script>
</body>
</html>
